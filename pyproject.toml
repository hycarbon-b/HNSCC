[project]
name = "hnscc-nnunet"
version = "0.1.0"
description = "nnUNet v2 pipeline for HNSCC 3D CT segmentation"
requires-python = ">=3.11"
dependencies = [
    "nibabel",
    "numpy",
    "matplotlib",
    "nnunetv2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
